# DepthWizard - one-command run.
#
#   docker compose up --build          first time (builds the image)
#   docker compose up                  afterwards
#   -> http://localhost:8000
#
# Ctrl+C to stop. `docker compose down` removes the container.

services:
  depthwizard:
    build: .
    image: depthwizard:latest
    container_name: depthwizard
    ports:
      - "8000:8000"
    environment:
      # Demo-tuned defaults: single-pass inference and a pre-warmed model, so an
      # upload on stage takes seconds rather than the ~45 s a tiled run costs.
      DW_TILED: "off"
      DW_PREWARM: "true"
      DW_MESH_DIM: "1024"
      DW_MAX_JOBS: "25"

      # Absolute metric elevation needs a free OpenTopography key. Without it a
      # GeoTIFF still gives CRS, lat/lon, GSD and GeoTIFF export - heights just
      # stay relative. Get one at portal.opentopography.org and either set it
      # here or put it in a .env file next to this compose file.
      OPENTOPO_API_KEY: "${OPENTOPO_API_KEY:-}"

      # Reference DEM: COP30 | SRTMGL1 | NASADEM | AW3D30.
      # COP30 is void-filled and is the better choice over Himalayan terrain.
      DW_DEM_TYPE: "COP30"

    volumes:
      # Processed scenes survive container restarts and are visible on the host.
      - ./data/web_jobs:/app/data/web_jobs
      # Cached DEM tiles, so the same extent is not re-downloaded.
      - ./data/srtm:/app/data/srtm
      # Uncomment to run the GAMUS fine-tuned weights instead of the zero-shot
      # backbone (the checkpoint is excluded from the image by .dockerignore):
      # - ./checkpoints:/app/checkpoints:ro

    restart: unless-stopped
